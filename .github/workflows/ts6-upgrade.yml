name: One-shot TypeScript 6 upgrade

on:
  push:
    branches:
      - chore/typescript-6

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/typescript-6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Upgrade TypeScript and regenerate lockfile
        run: npm install --save-dev typescript@^6.0.3

      - name: Remove one-shot workflow
        run: rm .github/workflows/ts6-upgrade.yml

      - name: Commit generated dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/ts6-upgrade.yml
          git commit -m "deps(ui): bump typescript to 6.0.3"
          git push origin HEAD:chore/typescript-6
