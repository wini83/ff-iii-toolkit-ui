name: Temporary ESLint 10 code fix

on:
  push:
    branches:
      - chore/eslint-10

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/eslint-10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Remove useless initial assignments
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/(app)/+layout.svelte')
          s = p.read_text()
          old = "  let dynamicTitle = DEFAULT_APP_TITLE;\n  let headTitle = DEFAULT_APP_TITLE;"
          new = "  let dynamicTitle: string;\n  let headTitle: string;"
          if old not in s:
              raise SystemExit('expected layout snippet not found')
          p.write_text(s.replace(old, new))
          PY
      - run: npm run check
      - run: npm run lint
      - run: npm run build
      - run: rm .github/workflows/tmp-eslint10-codefix.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'src/routes/(app)/+layout.svelte' .github/workflows/tmp-eslint10-codefix.yml
          git commit -m "fix(ui): remove useless title initializers"
          git push
